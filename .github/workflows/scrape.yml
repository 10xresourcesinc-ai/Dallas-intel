name: Dallas Intel Lead Scraper

on:
  schedule:
    - cron: "0 8 * * *"   # 8am UTC = 3am CDT daily
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Lookback window in days"
        required: false
        default: "30"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    name: Scrape & Export Leads
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: |
          & "C:\Users\gokoo\AppData\Local\Python\pythoncore-3.14-64\python.exe" -m pip install --upgrade pip
          & "C:\Users\gokoo\AppData\Local\Python\pythoncore-3.14-64\python.exe" -m pip install -r scraper/requirements.txt
        shell: powershell

      - name: Create output directories
        run: |
          New-Item -ItemType Directory -Force -Path dashboard
          New-Item -ItemType Directory -Force -Path data
        shell: powershell

      - name: Run scraper
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '30' }}
          PYTHONUNBUFFERED: "1"
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: & "C:\Users\gokoo\AppData\Local\Python\pythoncore-3.14-64\python.exe" scraper/fetch.py
        shell: powershell

      - name: Commit and push records
        run: |
          git config --global user.name  "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add dashboard/records.json data/records.json data/ghl_export.csv
          $diff = git diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git commit -m "chore: update leads $(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')" }
          git pull --rebase origin main
          git push
        shell: powershell

  deploy-dashboard:
    name: Deploy Dashboard to GitHub Pages
    needs: scrape
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
