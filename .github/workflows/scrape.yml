name: Dallas Intel Lead Scraper
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Lookback window in days"
        required: false
        default: "30"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  scrape:
    name: Scrape & Export Leads
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Always get a fresh copy — avoids stale ref issues
          fetch-depth: 0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scraper/requirements.txt

      - name: Create output directories
        run: |
          New-Item -ItemType Directory -Force -Path dashboard
          New-Item -ItemType Directory -Force -Path data

      - name: Run scraper
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '30' }}
          PYTHONUNBUFFERED: "1"
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python scraper/fetch.py

      - name: Commit and push records
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add dashboard/records.json data/records.json data/ghl_export.csv

          # Only commit if there are staged changes
          $diff = git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update leads"
          } else {
            Write-Host "No changes to commit"
            exit 0
          }

          # Retry push up to 3 times, pulling --rebase before each attempt
          $success = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "Push attempt $i of 3..."
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Rebase failed on attempt $i — aborting rebase and retrying"
              git rebase --abort 2>$null
              Start-Sleep -Seconds 10
              continue
            }
            git push origin main
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Push succeeded on attempt $i"
              $success = $true
              break
            }
            Write-Host "Push failed on attempt $i, waiting 15s before retry..."
            Start-Sleep -Seconds 15
          }

          if (-not $success) {
            Write-Host "ERROR: All push attempts failed"
            exit 1
          }

  deploy-dashboard:
    name: Deploy Dashboard to GitHub Pages
    needs: scrape
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
